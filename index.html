<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de canales</title>
<style>
  body { margin: 0; padding: 16px; background: #0f1f16; color: #fff; font-family: Arial, sans-serif; }
  h1 { color: #4ade80; font-size: 20px; }
  .canal { max-width: 640px; margin: 0 0 28px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .caja { aspect-ratio: 16 / 9; background: #000; display: grid; place-items: center; }
  iframe { width: 100%; height: 100%; border: 0; }
  button, a.link { background: #4ade80; color: #000; border: 0; border-radius: 10px; padding: 10px 18px;
    font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; }
  a.link { display: inline-block; background: #162a1c; color: #fff; margin-top: 8px; }
</style>
</head>
<body>
<h1>Prueba de canales de noticias</h1>
<p>Tocá "Probar" en cada canal y fijate si carga en vivo o da error.</p>
<div id="lista"></div>

<script>
  const CANALES = [
    { nombre: "TN",        id: "UCj6PcyLvpnIRT_2W_mwa9Aw" },
    { nombre: "C5N",       id: "UCFgk2Q2mVO1BklRQhSv6p0w" },
    { nombre: "La Nación+", id: "UCba3hpU7EFBSk817y9qZkiA", video: "FEWZjXJ7M0c" },
    { nombre: "Crónica",   id: "UCT7KFGv6s2a-rh2Jq8ZdM1g" },
    { nombre: "A24",       id: "UCR9120YBAqMfntqgRTKmkjQ" },
    { nombre: "Canal 26",  id: "UCrpMfcQNog595v5gAS-oUsQ", video: "C_RnFD6xiX8" }
  ];

  const lista = document.getElementById("lista");
  CANALES.forEach((c) => {
    const div = document.createElement("div");
    div.className = "canal";
    div.innerHTML =
      "<h2>" + c.nombre + "</h2>" +
      '<div class="caja"><button type="button">Probar</button></div>' +
      '<a class="link" target="_blank" rel="noopener" href="https://www.youtube.com/channel/' + c.id + '/live">Abrir en YouTube</a>';
    div.querySelector("button").addEventListener("click", () => {
      div.querySelector(".caja").innerHTML =
        '<iframe src="' + (c.video ? 'https://www.youtube.com/embed/' + c.video : 'https://www.youtube.com/embed/live_stream?channel=' + c.id) + '"' +
        ' referrerpolicy="strict-origin-when-cross-origin"' +
        ' allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
    });
    lista.appendChild(div);
  });
</script>
</body>
</html>
